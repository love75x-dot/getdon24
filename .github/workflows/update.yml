name: 당첨번호 업데이트·예약 발행

on:
  schedule:
    # cron 시간은 UTC 기준 (한국 시간 = UTC + 9).
    # GitHub 예약 실행은 몇 시간씩 늦거나 빠지는 일이 잦아서, 정각을 피해 여러 번 잡아 둔다.
    # 새 회차가 없으면 아무것도 바꾸지 않으니 여러 번 돌아도 괜찮다.
    - cron: '7,27,47 11-17 * * 6'   # 토 20:47 ~ 일 02:47, 20분마다 (로또 20:35 추첨)
    - cron: '17 0,3,6,9 * * 0'      # 일 09:17·12:17·15:17·18:17 (1등 판매점, 놓친 회차)
    - cron: '13,43 10-15 * * 4'     # 목 19:13 ~ 00:43, 30분마다 (연금복권 19:05 추첨)
    - cron: '23 1,7 * * 5'          # 금 10:23·16:23 (연금복권 놓친 회차)
    - cron: '23 22 * * *'           # 매일 07:23 예약 글 발행
    - cron: '23 2 * * *'            # 매일 11:23 예약 글 발행 (예비)
  # 업데이트 스크립트를 고쳐서 올리면 바로 한 번 돌려 본다
  push:
    branches: [main]
    paths: ['scripts/update-*.mjs', 'scripts/lib.mjs', 'scripts/test.mjs', '.github/workflows/update.yml']
  workflow_dispatch:
    inputs:
      full:
        description: '공식 자료로 전체 다시 받기 (약 40분, 처음 한 번 권장)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 로또 당첨번호·1등 판매점
        id: lotto
        continue-on-error: true
        run: node scripts/update-lotto.mjs ${{ inputs.full && '--full' || '' }}

      - name: 연금복권 당첨번호
        id: pension
        continue-on-error: true
        run: node scripts/update-pension.mjs ${{ inputs.full && '--full' || '' }}

      - name: 데이터 검사
        run: node scripts/test.mjs

      - name: 예약 발행 목록
        run: node scripts/build.mjs --published

      - name: 사이트 생성 확인
        run: node scripts/build.mjs

      - name: 바뀐 내용 저장 (Cloudflare Pages 가 자동으로 다시 배포)
        run: |
          git config user.name "getdon24-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "데이터 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push
          fi

      - name: 실패 알림
        if: steps.lotto.outcome == 'failure' || steps.pension.outcome == 'failure'
        run: |
          echo "::error::동행복권에서 데이터를 받지 못했어요. 위의 '로또' 또는 '연금복권' 단계 로그를 확인하세요. 기존 데이터는 그대로예요."
          exit 1
