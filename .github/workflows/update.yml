name: 당첨번호 업데이트·예약 발행

on:
  schedule:
    # cron 시간은 UTC 기준이에요 (한국 시간 = UTC + 9). GitHub 사정으로 몇 분~수십 분 늦을 수 있어요.
    - cron: '50 11 * * 6'     # 토 20:50 로또 추첨 직후
    - cron: '20,50 12 * * 6'  # 토 21:20, 21:50
    - cron: '40 13 * * 6'     # 토 22:40
    - cron: '0 0 * * 0'       # 일 09:00 1등 판매점 공개 확인
    - cron: '30 10 * * 4'     # 목 19:30 연금복권 추첨 직후
    - cron: '30 11 * * 4'     # 목 20:30
    - cron: '0 22 * * *'      # 매일 07:00 예약 글 발행 확인
  # 업데이트 스크립트를 고쳐서 올리면 바로 한 번 돌려 본다
  push:
    branches: [main]
    paths: ['scripts/update-*.mjs', 'scripts/lib.mjs', 'scripts/test.mjs', '.github/workflows/update.yml']
  workflow_dispatch:
    inputs:
      full:
        description: '공식 자료로 전체 다시 받기 (약 40분, 처음 한 번 권장)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 로또 당첨번호·1등 판매점
        id: lotto
        continue-on-error: true
        run: node scripts/update-lotto.mjs ${{ inputs.full && '--full' || '' }}

      - name: 연금복권 당첨번호
        id: pension
        continue-on-error: true
        run: node scripts/update-pension.mjs ${{ inputs.full && '--full' || '' }}

      - name: 데이터 검사
        run: node scripts/test.mjs

      - name: 예약 발행 목록
        run: node scripts/build.mjs --published

      - name: 사이트 생성 확인
        run: node scripts/build.mjs

      - name: 바뀐 내용 저장 (Cloudflare Pages 가 자동으로 다시 배포)
        run: |
          git config user.name "getdon24-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "데이터 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push
          fi

      - name: 실패 알림
        if: steps.lotto.outcome == 'failure' || steps.pension.outcome == 'failure'
        run: |
          echo "::error::동행복권에서 데이터를 받지 못했어요. 위의 '로또' 또는 '연금복권' 단계 로그를 확인하세요. 기존 데이터는 그대로예요."
          exit 1
