name: 정부 지원사업 수집

on:
  schedule:
    - cron: '37 20 * * *'   # 매일 05:37 (한국 시간) — 정각을 피해 잡음
    - cron: '37 2 * * *'    # 매일 11:37 예비 (GitHub 예약이 빠지는 날 대비)
  push:
    branches: [main]
    paths: ['scripts/update-support.mjs', '.github/workflows/support.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update        # 당첨번호 업데이트와 동시에 커밋하지 않게 같은 그룹
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 기업마당 공고 수집
        env:
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
        run: node scripts/update-support.mjs
      - name: 사이트 생성 확인
        run: node scripts/build.mjs
      - name: 바뀐 내용 저장
        run: |
          git config user.name "getdon24-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/support/gov.json
          if git diff --cached --quiet; then echo "바뀐 내용 없음"; else
            git commit -m "정부 지원사업 수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git pull --rebase && git push
          fi
